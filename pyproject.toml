[project]
name = "ai-papers-agentic-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Nody3112V", email = "nope31122006@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.22.1",
    "arize-phoenix-otel>=0.17.3",
    "chainlit>=2.12.0",
    "fastapi>=0.165.0",
    "fastembed>=0.9.1",
    "httpx>=0.28.1",
    "langchain-core>=1.8.4",
    "langchain-google-genai>=3.2.0",
    "langchain-groq>=1.2.1",
    "langgraph>=1.2.24",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "mcp>=1.30.0",
    "openinference-instrumentation-langchain>=0.1.90",
    "opentelemetry-sdk>=1.45.2",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "pyyaml>=6.0.4",
    "qdrant-client>=1.20.0",
    "slowapi>=0.1.10",
    "sqlglot>=30.35.0",
    "sse-starlette>=3.7.1",
    "tenacity>=9.2.1",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[dependency-groups]
dev = [
    "arize-phoenix>=14.6.0",
    "graphql-core<3.3",
    "psutil>=7.2.2",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.6",
]
kaggle = [
    "arxiv>=4.1.0",
    "datasets>=5.0.1",
    "deepeval>=4.3.5",
    "docling>=2.152.0",
    "fastembed-gpu>=0.9.1",
    "pymupdf4llm>=2.1",
    "ragas>=0.4.4",
    "sentence-transformers>=6.3.0",
]
